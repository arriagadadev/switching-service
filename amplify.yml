version: 1
frontend:
  phases:
    preBuild:
      commands:
        - pwd
        - ls -la
        - |
          if [ -f package.json ] && [ -f quasar.config.js ]; then
            echo Already in frontend directory
            WORK_DIR=.
          elif [ -d frontend ] && [ -f frontend/package.json ]; then
            echo Found frontend directory
            WORK_DIR=frontend
          else
            echo ERROR frontend directory or package.json not found
            find . -maxdepth 2 -type f -name package.json 2>/dev/null || true
            find . -maxdepth 1 -type d | head -20
            exit 1
          fi
        - |
          if [ "$WORK_DIR" != "." ]; then
            echo Installing dependencies in frontend
            cd "$WORK_DIR"
          else
            echo Installing dependencies in current directory
          fi
        - pwd
        - test -f package.json || exit 1
        - npm ci
    build:
      commands:
        - |
          if [ -f package.json ] && [ -f quasar.config.js ]; then
            echo Already in frontend directory
          elif [ -d frontend ] && [ -f frontend/package.json ]; then
            echo Entering frontend directory
            cd frontend
          else
            echo ERROR Cannot find frontend directory or package.json
            exit 1
          fi
        - pwd
        - npm run build
  artifacts:
    baseDirectory: frontend/dist/spa
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
