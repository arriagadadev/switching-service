version: 1
frontend:
  phases:
    preBuild:
      commands:
        - pwd
        - ls -la
        - |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            echo Found frontend directory
            cd frontend
          else
            echo ERROR frontend directory or package.json not found
            find . -maxdepth 2 -type f -name package.json 2>/dev/null || true
            exit 1
          fi
        - pwd
        - test -f package.json || exit 1
        - npm ci
    build:
      commands:
        - |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend
          fi
        - pwd
        - echo "Checking environment variables"
        - if [ -n "$VITE_COGNITO_USER_POOL_ID" ]; then echo "VITE_COGNITO_USER_POOL_ID is set"; else echo "VITE_COGNITO_USER_POOL_ID is NOT set"; fi
        - if [ -n "$VITE_COGNITO_USER_POOL_CLIENT_ID" ]; then echo "VITE_COGNITO_USER_POOL_CLIENT_ID is set"; else echo "VITE_COGNITO_USER_POOL_CLIENT_ID is NOT set"; fi
        - if [ -n "$VITE_AWS_REGION" ]; then echo "VITE_AWS_REGION is set"; else echo "VITE_AWS_REGION is NOT set"; fi
        - if [ -n "$VITE_API_ENDPOINT" ]; then echo "VITE_API_ENDPOINT is set"; else echo "VITE_API_ENDPOINT is NOT set"; fi
        - npm run build
        - echo Build completed, checking dist directory
        - ls -la dist 2>/dev/null || echo Dist not found
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
